# ── Server ──
server.port=8080

# ── Database (PostgreSQL) ──
# Replace with your Railway PostgreSQL URL when you create the database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spark}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Redis (Upstash) ──
# Upstash provides a Redis URL with SSL — use rediss:// (with double s)
spring.data.redis.url=${UPSTASH_REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=${UPSTASH_REDIS_SSL:false}

# ── JWT ──
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# ── Google OAuth ──
google.client-id=${GOOGLE_CLIENT_ID:}

# ── Groq AI ──
groq.api.key=${GROQ_API_KEY:}

# ── Gemini AI (fallback) ──
gemini.api.key=${GEMINI_API_KEY:}

# ── Stripe ──
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id=${STRIPE_PRICE_ID:}

# ── App URL ──
app.frontend-url=${FRONTEND_URL:http://localhost:8080}

# ── Logging ──
logging.level.com.spark=INFO
logging.level.org.springframework.security=WARN

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
